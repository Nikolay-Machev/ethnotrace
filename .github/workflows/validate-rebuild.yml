name: Validate and rebuild data
on:
  push:
    branches:
      - validate-rebuild-2026-11-05
      - review-b-comparison-proposals-2026-11-05
      - prepare-comparison-adjudication-2026-11-05
      - audit-missing-source-fields-2026-11-05
      - verify-tx001-tx002-2026-11-05
      - adjudicate-assisted-consensus-2026-11-05
      - resolve-relevance-primary-source-followup-2026-11-05
      - approve-five-relevance-pairs-2026-11-05
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and rebuild
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preprocess.py
          python scripts/validate_review_links.py
          python scripts/review_progress.py
          python scripts/evaluate.py
          python scripts/rebuild.py
          python scripts/rebuild.py --check
          python -m unittest discover -s tests -v
      - name: Report generated changes
        if: always()
        run: git status --short
      - name: Commit regenerated files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate validated reports and datasets"
            git push
          fi
