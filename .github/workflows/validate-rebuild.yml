name: Validate committed data
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate committed data without writing to GitHub
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preprocess.py
          python scripts/validate_review_links.py
          python scripts/review_progress.py
          python scripts/evaluate.py
          python scripts/rebuild.py --check
          python -m unittest discover -s tests -v
          # Fail when checked-in generated outputs are stale.
          # Do not commit or push using github-actions[bot].
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Show working tree changes on failure
        if: failure()
        run: git status --short
