name: Temporary generated output reconciliation
on:
  push:
    branches:
      - verify-experimental-findings-12-2026-11-06
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild without committing
        shell: bash
        run: |
          python scripts/rebuild.py
          python - <<'PY'
          from pathlib import Path
          import base64
          for name in ("data/evaluation/baseline_report.json", "web/evaluation-data.js"):
              data = Path(name).read_bytes()
              print("START_GENERATED:" + name)
              print(base64.b64encode(data).decode())
              print("STOP_GENERATED:" + name)
          PY
