name: Assisted exploratory generalization scoring
on:
  push:
    branches:
      - assisted-new-paper-ranker-evaluation-2026-11-05
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assisted-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check reviews, scope, and frozen input hashes before inference
        run: python scripts/evaluate_assisted_generalization.py --check
      - name: Install frozen semantic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-semantic.txt
      - name: Run frozen lexical, semantic, hybrid rankers on assisted decisions
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python scripts/evaluate_assisted_generalization.py
      - uses: actions/upload-artifact@v4
        with:
          name: assisted-generalization-results
          path: data/generalization/assisted_exploratory_results.json
          retention-days: 30
